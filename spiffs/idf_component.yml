version: "1.0.0"
description: "SPIFFS - SPI Flash File System, with ESP-IDF VFS integration"
url: https://github.com/espressif/idf-extra-components/tree/master/spiffs
repository: https://github.com/espressif/idf-extra-components.git
dependencies:
  idf: ">=6.0"
sbom:
  manifests:
    - path: sbom_spiffs.yml
      dest: spiffs
files:
  exclude:
    - "spiffs/afltests/**/*"
    - "spiffs/docs/**/*"
    - "spiffs/py/**/*"
